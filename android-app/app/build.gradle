plugins {
    id "com.android.application"
}

android {
    namespace "com.estudiemos.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.estudiemos.app"
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName "1.5.1"
    }

    signingConfigs {
        release {
            def signingFile = System.getenv("ANDROID_KEYSTORE_PATH")
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("ANDROID_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.google.firebase:firebase-messaging:25.1.2"
}
