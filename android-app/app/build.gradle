plugins {
    id "com.android.application"
}

def appOrigin = providers.gradleProperty('estudiemosAppOrigin').getOrElse('https://estudiemos.estudiemos-services.workers.dev')
def allowedOrigins = ['https://estudiemos-app.vercel.app', 'https://estudiemos-candidate.estudiemos-services.workers.dev', 'https://estudiemos.estudiemos-services.workers.dev']
if (!allowedOrigins.contains(appOrigin)) throw new GradleException('Untrusted Estudiemos app origin')

android {
    namespace "com.estudiemos.app"
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.estudiemos.app"
        minSdk 26
        targetSdk 35
        versionCode 38
        versionName "1.7.0"
        buildConfigField 'String', 'APP_ORIGIN', '"' + appOrigin + '"'
        manifestPlaceholders = [estudiemosAppHost: new URI(appOrigin).host]
    }

    signingConfigs {
        release {
            def signingFile = System.getenv("ANDROID_KEYSTORE_PATH")
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("ANDROID_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.google.firebase:firebase-messaging:26.0.1"
}
