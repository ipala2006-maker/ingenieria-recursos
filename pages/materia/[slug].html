<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma educativa gratuita para estudiantes de ingeniería." />
    <meta name="application-name" content="Estudiemos" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:site_name" content="Estudiemos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Materia | Estudiemos" />
    <meta property="og:description" content="Plataforma educativa gratuita para estudiantes de ingeniería." />
    <meta property="og:url" content="https://estudiemos-app.vercel.app/pages/materia/[slug].html" />
    <link rel="canonical" href="https://estudiemos-app.vercel.app/pages/materia/[slug].html" />
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../../site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="../../assets/icon-180.png" />
    <title>Materia | Estudiemos</title>
    <script src="../../scripts/theme-init.js?v=20260811-floating-timer"></script>
    <link rel="stylesheet" href="../../styles/app.css?v=20260813-mobile-pip" />
  </head>

  <body>

    <header class="topbar">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true">&sum;</span>
        <span class="brand__text">Estudiemos</span>
      </a>
    </header>

    <main class="container">

      <div class="breadcrumbs" id="breadcrumbs"></div>

      <section class="section">

        <div class="section__head">
          <h2 id="materiaTitle">Materia</h2>
          <p id="materiaDesc" class="section__hint"></p>
        </div>

        <div id="topicsGrid" class="topic-grid">
          <div class="loading-placeholder">Cargando temas...</div>
        </div>

      </section>

    </main>

    <!-- DATA -->
    <script src="../../data/data.js?v=20260804-quimica-completa"></script>
    <script src="../../scripts/global-search.js?v=20260813-mobile-pip"></script>

    <script>
      function renderAiProfessor(materia) {
        if (!materia.aiProfessor?.url || document.querySelector(".ai-professor-card")) return;

        const head = document.querySelector(".section__head");
        if (!head) return;

        const card = document.createElement("div");
        card.className = "ai-professor-card";
        card.innerHTML = `
          <div>
            <p class="ai-professor-card__label">Profesor IA</p>
            <h3>${materia.aiProfessor.title || "Profesor de " + materia.title}</h3>
            <p>Consultá dudas de esta materia con una guía paso a paso.</p>
          </div>
          <a class="btn ai-professor-card__btn" href="${materia.aiProfessor.url}" target="_blank" rel="noopener noreferrer" aria-label="Consultar al profesor de ${materia.title}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 1.8-2.3 3"/><path d="M12 16h.01"/></svg>
            <span>Consultar</span>
          </a>
        `;
        head.insertAdjacentElement("afterend", card);
      }

      const pathParts = location.pathname.split("/").filter(Boolean);
      const slug = pathParts[pathParts.length - 1].replace(".html", "");

      let materiaFound = null;

      for (const carrera of DATA.carreras) {
        for (const materia of carrera.materias) {
          if (materia.slug === slug) {
            materiaFound = materia;
            break;
          }
        }
      }

      if (!materiaFound) {
        document.body.innerHTML = "<h1>Materia no encontrada</h1>";
      } else {

        document.getElementById("materiaTitle").textContent = materiaFound.title;
        document.getElementById("materiaDesc").textContent = materiaFound.description;

        renderAiProfessor(materiaFound);

        const grid = document.getElementById("topicsGrid");

        grid.innerHTML = materiaFound.temas.map(t => `
          <a class="topic-card" href="../tema/${t.slug}.html">
            <div>
              <p class="topic-card__title">${t.title}</p>
              <div class="topic-card__meta">${t.meta}</div>
            </div>
          </a>
        `).join("");

      }
    </script>

  </body>
</html>
