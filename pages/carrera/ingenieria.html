<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="application-name" content="Estudiemos" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:site_name" content="Estudiemos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ingeniería | Estudiemos" />
    <meta property="og:description" content="Plataforma educativa gratuita para estudiantes de ingeniería." />
    <meta property="og:url" content="https://estudiemos-app.vercel.app/pages/carrera/ingenieria.html" />
    <link rel="canonical" href="https://estudiemos-app.vercel.app/pages/carrera/ingenieria.html" />
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="../../site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="../../assets/icon-180.png" />
    <title>Ingeniería | Estudiemos</title>
    <script src="../../scripts/theme-init.js?v=20260826-workspace-widget"></script>
    <link rel="stylesheet" href="../../styles/app.css?v=20260825-whatsapp" />
  </head>

  <body>

    <header class="topbar">
      <a class="brand" href="../../">
        <span class="brand__mark" aria-hidden="true">&sum;</span>
        <span class="brand__text">Estudiemos</span>
      </a>
    </header>

    <main class="container">

      <div class="breadcrumbs" id="breadcrumbs"></div>

      <section class="section">

        <div class="section__head">
          <h2 id="carreraTitle">Ingeniería</h2>
          <p id="carreraDesc" class="section__hint">Carrera de ingeniería.</p>
        </div>

        <div id="materiasGrid" class="cards-grid">
          <a class="card" href="../materia/analisis-matematico-1.html">
            <div class="card__body">
              <h3 class="card__title">Análisis Matemático I</h3>
              <p class="card__desc">Límites, derivadas e integrales.</p>
            </div>
          </a>
          <a class="card" href="../materia/fisica-1.html">
            <div class="card__body">
              <h3 class="card__title">Física I</h3>
              <p class="card__desc">Mecánica y termodinámica.</p>
            </div>
          </a>
          <a class="card" href="../materia/quimica.html">
            <div class="card__body">
              <h3 class="card__title">Química</h3>
              <p class="card__desc">Estructura atómica, enlaces y reacciones.</p>
            </div>
          </a>
        </div>

      </section>

    </main>

    <!-- DATA -->
    <script src="../../data/data.js?v=20260804-quimica-completa"></script>
    <script src="../../scripts/global-search.js?v=20260830-pc-install"></script>

    <script>
      const pathParts = location.pathname.split("/").filter(Boolean);
      const slug = pathParts[pathParts.length - 1].replace(".html", "");

      const carrera = DATA.carreras.find(c => c.slug === slug);

      if (!carrera) {
        document.body.innerHTML = "<h1>Carrera no encontrada</h1>";
      } else {

        const title = document.getElementById("carreraTitle");
        const desc = document.getElementById("carreraDesc");
        if (title.textContent.trim() === "Carrera") title.textContent = carrera.title;
        if (!desc.textContent.trim()) desc.textContent = carrera.description;

        const grid = document.getElementById("materiasGrid");

        if (!grid.querySelector(".card")) {
          grid.innerHTML = carrera.materias.map(m => `
            <a class="card" href="../materia/${m.slug}.html">
              <div class="card__body">
                <h3 class="card__title">${m.title}</h3>
                <p class="card__desc">${m.description}</p>
              </div>
            </a>
          `).join("");
        }

      }
    </script>

  </body>
</html>
