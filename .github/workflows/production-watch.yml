name: Estudiemos production watch

on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: estudiemos-production-watch
  cancel-in-progress: false

jobs:
  watch:
    if: vars.ESTUDIEMOS_MONITOR_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check availability, alarm readiness, backups and optional Workers quotas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CF_ANALYTICS_READ_TOKEN: ${{ secrets.CF_ANALYTICS_READ_TOKEN }}
        run: node scripts/production-watch.cjs
