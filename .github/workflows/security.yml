name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit server dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test mobile notifications
        run: npm run test:mobile

      - name: Test friend privacy and permissions
        run: node --test tests/friends.test.cjs

      - name: Run application tests
        run: node --test tests/*.test.js tests/free-release.test.cjs tests/commercial-launch-hidden.test.cjs tests/home-board.test.cjs tests/home-free-layout.test.cjs tests/home-layout-storage.test.cjs tests/windows-setup-flow.test.cjs

      - name: Check tracked files and dependencies
        run: node scripts/security-check.js

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --no-banner
