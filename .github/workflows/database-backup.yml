name: Encrypted database backup

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install age from Debian
        run: apt-get update -qq && apt-get install -y --no-install-recommends age ca-certificates
      - name: Export directly into encryption
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PROJECT_REF: ${{ vars.BACKUP_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_SSL_ROOT_CERT: supabase/certs/prod-ca-2021.crt
          BACKUP_OUTPUT_DIR: .backups/database
          BACKUP_MAX_BYTES: '33554432'
        run: node scripts/backup-database.cjs
      - name: Retain only encrypted output for seven days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .backups/database/*.dump.age
            .backups/database/*.dump.age.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
