name: Verify Android alarms
on:
  pull_request:
    paths: ["android-app/**", ".github/workflows/android-verify.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        origin: ["https://estudiemos-app.vercel.app", "https://estudiemos-candidate.estudiemos-services.workers.dev"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug -PestudiemosAppOrigin=${{ matrix.origin }}
        working-directory: android-app
