name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "scripts/bandeja.js"
      - "scripts/pomodoro.js"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Estudiemos-Android
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish permanent Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/Estudiemos-Android.apk"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            "${RUNNER_TEMP}/Estudiemos-Android.apk" \
            --target "${GITHUB_SHA}" \
            --title "Estudiemos para Android" \
            --notes "Última versión instalable de Estudiemos para Android."
