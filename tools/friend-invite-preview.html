<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Estudiemos: invitacion de amistad</title>
<style>
@font-face{font-family:Space;src:url('../assets/fonts/space-grotesk-latin.woff2') format('woff2');font-weight:300 700}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;padding:56px 64px;background:#f5f7fa;color:#22324b;font-family:Space,system-ui,sans-serif;letter-spacing:0}
header{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700}header img{width:58px;height:58px;border-radius:8px}
main{display:grid;grid-template-columns:1fr 270px;gap:54px;align-items:center;margin-top:80px}
.label{color:#3d639e;font-size:19px;font-weight:700;margin:0 0 22px}h1{font-size:64px;line-height:1.14;margin:0;font-weight:600}h1 span{display:block}
.caption{font-size:25px;color:#5b6b82;line-height:1.55;margin:22px 0 0}
.friends{position:relative;height:224px}.avatar{position:absolute;width:126px;height:126px;border-radius:50%;display:grid;place-items:center;border:5px solid #f5f7fa;box-shadow:0 6px 24px #23304813}
.avatar img{width:58px;height:58px}.first{top:0;left:4px;background:#dce8ff}.second{bottom:0;right:4px;background:#d8efe8}.join{position:absolute;top:93px;left:113px;width:44px;height:44px;background:#285dbb;border:5px solid #f5f7fa;border-radius:50%;color:white;font-size:26px;display:grid;place-items:center;z-index:1}
footer{position:absolute;left:64px;right:64px;bottom:36px;border-top:1px solid #d6deea;padding-top:18px;display:flex;justify-content:space-between;font-size:17px;color:#5b6b82}
</style></head>
<body>
<header><img src="../assets/icon-192.png" alt="">Estudiemos</header>
<main><section><p class="label">SOLICITUD DE AMISTAD</p><h1><span>&#191;Estudiamos</span>juntos?</h1><p class="caption">Tu grupo de estudio,<br>tambi&#233;n en Estudiemos.</p></section>
<div class="friends"><div class="avatar first"><img src="../assets/icons/users-round.svg" alt=""></div><div class="join">+</div><div class="avatar second"><img src="../assets/icons/users-round.svg" alt=""></div></div></main>
<footer><span>Abr&#237; la invitaci&#243;n y conect&#225; con tu amigo.</span><span>estudiemos-app.vercel.app</span></footer>
</body></html>
