<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma educativa gratuita para estudiantes de ingeniería." />
    <meta name="application-name" content="Estudiemos" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:site_name" content="Estudiemos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Estudiemos" />
    <meta property="og:description" content="Plataforma educativa gratuita para estudiantes de ingeniería." />
    <meta property="og:url" content="https://estudiemos-app.vercel.app/" />
    <link rel="canonical" href="https://estudiemos-app.vercel.app/" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <title>Estudiemos</title>
    <script src="./scripts/theme-init.js?v=20260811-floating-timer"></script>
    <link rel="stylesheet" href="./styles/app.css?v=20260813-mobile-pip-hd" />
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <span class="brand__mark" aria-hidden="true">&sum;</span>
        <span class="brand__text">Estudiemos</span>
      </a>

      <nav class="topbar__nav" aria-label="Navegacion principal">
        <a class="topbar__link" href="./about.html">Acerca de</a>
        <span class="topbar__link topbar__link--soon" aria-disabled="true">
          Modo enfoque
          <span class="topbar__soon">Próximamente</span>
        </span>
      </nav>
    </header>

    <main class="container">

      <section class="hero">
        <h1>Estudiemos</h1>
      </section>

      <section class="section">
        <div class="section__head">
          <h2>Carreras</h2>
          <p class="section__hint">Haz clic para ver las materias.</p>
        </div>

        <div id="materiasGrid" class="cards-grid">
          <div class="loading-placeholder">Cargando carreras...</div>
        </div>
      </section>

      <footer class="footer">
        <span>© <span id="year"></span> Estudiemos</span>
      </footer>

    </main>

    <!-- DATA SIEMPRE PRIMERO -->
    <script src="./data/data.js?v=20260804-quimica-completa"></script>
    <script src="./scripts/global-search.js?v=20260813-mobile-pip-hd"></script>

    <script>
      const grid = document.getElementById("materiasGrid");

      const data = DATA.carreras;

      grid.innerHTML = data.map(m => `
        <a class="card" href="./pages/carrera/${m.slug}.html">
          <div class="card__body">
            <h3 class="card__title">${m.title}</h3>
            <p class="card__desc">${m.description}</p>
          </div>
        </a>
      `).join("");
    </script>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>

  </body>
</html>
