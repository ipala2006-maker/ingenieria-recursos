[Rainmeter]
Update=-1
AccurateText=1
ContextTitle=Abrir Racha en Estudiemos
ContextAction=["https://estudiemos-app.vercel.app/?pomodoro=1"]
ContextTitle2=Actualizar widget
ContextAction2=[!CommandMeasure WebView "Reload"]
ContextTitle3=Restablecer tamaño
ContextAction3=[!SetVariable WidgetWidth "340"][!SetVariable WidgetHeight "300"][!WriteKeyValue Variables WidgetWidth "340"][!WriteKeyValue Variables WidgetHeight "300"][!UpdateMeasure WebView][!UpdateMeter WidgetBounds][!Redraw]

[Variables]
WidgetWidth=340
WidgetHeight=300

[Metadata]
Name=Estudiemos - Racha
Author=Estudiemos
Information=Presencia y tiempo de estudio sincronizados.
Version=1.1

[WebView]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=streak&embed=rainmeter&desktop=3
W=#WidgetWidth#
H=#WidgetHeight#
X=0
Y=0
Clickthrough=0
ZoomControl=0
AssistiveFeatures=0
DynamicVariables=1

[WidgetBounds]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight# | StrokeWidth 0 | FillColor 0,0,0,1
DynamicVariables=1
