[Rainmeter]
Update=5000
AccurateText=1
OnUpdateAction=[!CommandMeasure WebView "Execute if(window.EstudiemosDesktopWidgets){window.EstudiemosDesktopWidgets.refreshFromCloud();}"]
ContextTitle=Abrir Mi espacio en Estudiemos
ContextAction=["web+estudiemos://open?target=home"]
ContextTitle2=Actualizar widget
ContextAction2=[!CommandMeasure WebView "Reload"]
ContextTitle3=Restablecer tamaño
ContextAction3=[!SetVariable WidgetWidth "380"][!SetVariable WidgetHeight "360"][!WriteKeyValue Variables WidgetWidth "380"][!WriteKeyValue Variables WidgetHeight "360"][!UpdateMeasure WebView][!UpdateMeter WidgetBounds][!Redraw]

[Variables]
WidgetWidth=380
WidgetHeight=360

[Metadata]
Name=Estudiemos - Mi espacio
Author=Estudiemos
Information=Carpetas y archivos personales sincronizados con tu cuenta.
Version=1.3

[WebView]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=workspace&embed=rainmeter&desktop=4
W=#WidgetWidth#
H=#WidgetHeight#
X=0
Y=0
Clickthrough=0
ZoomControl=0
AssistiveFeatures=0
DynamicVariables=1

[WidgetBounds]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight# | StrokeWidth 0 | FillColor 0,0,0,1
DynamicVariables=1
