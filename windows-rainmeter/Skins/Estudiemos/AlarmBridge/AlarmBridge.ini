[Rainmeter]
Update=15000
AccurateText=1
WindowX=-10000
WindowY=-10000
Draggable=0
ClickThrough=1
KeepOnScreen=0
SnapEdges=0
OnUpdateAction=[!CommandMeasure AlarmWeb "Execute if(window.EstudiemosDesktopWidgets){window.EstudiemosDesktopWidgets.refreshFromCloud();}"]

[Metadata]
Name=Estudiemos - Alarmas en segundo plano
Author=Estudiemos
Information=Mantiene sincronizadas las alarmas de Inbox aunque no haya widgets visibles.
Version=1.0

[AlarmWeb]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=inbox&embed=rainmeter&desktop=3&alarmbridge=1
W=2
H=2
X=0
Y=0
Clickthrough=1
ZoomControl=0
AssistiveFeatures=0

[BridgeBounds]
Meter=Shape
Shape=Rectangle 0,0,2,2 | StrokeWidth 0 | FillColor 0,0,0,1
