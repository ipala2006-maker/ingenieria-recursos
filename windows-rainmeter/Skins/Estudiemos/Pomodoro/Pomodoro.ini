[Rainmeter]
Update=-1
AccurateText=1
ContextTitle=Abrir Pomodoro en Estudiemos
ContextAction=["https://estudiemos-app.vercel.app/?pomodoro=1"]
ContextTitle2=Actualizar widget
ContextAction2=[!CommandMeasure WebView "Reload"]
ContextTitle3=Restablecer tamaño
ContextAction3=[!SetVariable WidgetWidth "360"][!SetVariable WidgetHeight "380"][!WriteKeyValue Variables WidgetWidth "360"][!WriteKeyValue Variables WidgetHeight "380"][!UpdateMeasure WebView][!UpdateMeter WidgetBounds][!Redraw]

[Variables]
WidgetWidth=360
WidgetHeight=380

[Metadata]
Name=Estudiemos - Pomodoro
Author=Estudiemos
Information=Temporizador Pomodoro interactivo.
Version=1.1

[WebView]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=pomodoro&embed=rainmeter&desktop=3
W=#WidgetWidth#
H=#WidgetHeight#
X=0
Y=0
Clickthrough=0
ZoomControl=0
AssistiveFeatures=0
DynamicVariables=1

[WidgetBounds]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight# | StrokeWidth 0 | FillColor 0,0,0,1
DynamicVariables=1
