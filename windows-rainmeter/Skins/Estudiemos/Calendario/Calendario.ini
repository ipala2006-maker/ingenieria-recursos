[Rainmeter]
Update=-1
AccurateText=1
ContextTitle=Abrir Calendario en Estudiemos
ContextAction=["https://estudiemos-app.vercel.app/?agenda=1"]
ContextTitle2=Actualizar widget
ContextAction2=[!CommandMeasure WebView "Reload"]

[Variables]
Scale=1
BaseWidth=340
BaseHeight=330

[Metadata]
Name=Estudiemos - Calendario
Author=Estudiemos
Information=Calendario semanal sincronizado con tu cuenta.
Version=1.1

[WebView]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=calendar&embed=rainmeter&desktop=2
W=(#BaseWidth#*#Scale#)
H=(#BaseHeight#*#Scale#)
X=0
Y=0
Clickthrough=0
ZoomControl=0
AssistiveFeatures=0
DynamicVariables=1

[WidgetBounds]
Meter=Shape
Shape=Rectangle 0,0,(#BaseWidth#*#Scale#),(#BaseHeight#*#Scale#) | StrokeWidth 0 | FillColor 0,0,0,1
DynamicVariables=1
