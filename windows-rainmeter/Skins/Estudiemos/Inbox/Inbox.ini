[Rainmeter]
Update=-1
AccurateText=1
ContextTitle=Abrir Inbox en Estudiemos
ContextAction=["web+estudiemos://open?target=agenda"]
ContextTitle2=Actualizar widget
ContextAction2=[!CommandMeasure WebView "Reload"]
ContextTitle3=Restablecer tamaño
ContextAction3=[!SetVariable WidgetWidth "360"][!SetVariable WidgetHeight "320"][!WriteKeyValue Variables WidgetWidth "360"][!WriteKeyValue Variables WidgetHeight "320"][!UpdateMeasure WebView][!UpdateMeter WidgetBounds][!Redraw]

[Variables]
WidgetWidth=360
WidgetHeight=320

[Metadata]
Name=Estudiemos - Inbox
Author=Estudiemos
Information=Tareas pendientes sincronizadas con tu cuenta.
Version=1.2

[WebView]
Measure=Plugin
Plugin=WebView2
URL=https://estudiemos-app.vercel.app/widget.html?view=inbox&embed=rainmeter&desktop=3
W=#WidgetWidth#
H=#WidgetHeight#
X=0
Y=0
Clickthrough=0
ZoomControl=0
AssistiveFeatures=0
DynamicVariables=1

[WidgetBounds]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight# | StrokeWidth 0 | FillColor 0,0,0,1
DynamicVariables=1
